[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki-kernel"
version = "0.1.0"
description = "An embeddable agent kernel."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]
