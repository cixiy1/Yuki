[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki"
version = "0.1.0"
description = "Yuki kernel: an embeddable agent kernel plus the Yuki chat example."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "python-dotenv",
    "json5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
yuki = "yuki.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
